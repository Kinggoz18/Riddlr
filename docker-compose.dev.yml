services:
  postgres:
    ports:
      - "5432:5432"
  valkey:
    ports:
      - "6379:6379"
  mailpit:
    ports:
      - "8025:8025"
      - "1025:1025"
  proxy:
    volumes:
      - ./docker/caddy/Caddyfile.dev:/etc/caddy/Caddyfile:ro
    depends_on:
      - api
      - web
      - mailpit
      - searxng
