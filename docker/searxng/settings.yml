# See https://docs.searxng.org/admin/settings/settings_search.html
use_default_settings: true

general:
  instance_name: "Riddlr SearXNG"
  enable_metrics: false

search:
  formats:
    - html
    - json

server:
  # Overridden at runtime by SEARXNG_SECRET. Do not reuse a committed secret.
  secret_key: ""
  limiter: true
  public_instance: false
  image_proxy: false
  bind_address: "0.0.0.0"
  port: 8080

ui:
  static_use_hash: true

engines:
  - name: bing news
    disabled: true
